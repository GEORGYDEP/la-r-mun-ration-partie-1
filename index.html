<!DOCTYPE html>
<html lang="fr-BE">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Les rémunérations — Partie 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0e14; --bg2:#0f151f; --bg3:#16202d; --card:#121b27;
  --accent:#3ae08c; --accent2:#1fa968; --orange:#ff9f43; --gold:#ffd166; --blue:#4aa8ff; --violet:#a78bfa;
  --text:#e9eff7; --text2:#9fb0c5; --text3:#6f8299;
  --border:#22303f; --radius:14px;
  --success:#3ae08c; --error:#ff5f6d; --warn:#ffc94d;
  --paper:#fdfdf9; --ink:#1d2733;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);
  background-image:radial-gradient(1100px 520px at 12% -8%,rgba(58,224,140,.10),transparent 60%),
                   radial-gradient(900px 460px at 96% 4%,rgba(255,159,67,.09),transparent 60%);
  background-attachment:fixed;line-height:1.55;-webkit-text-size-adjust:100%;
}
.mono{font-family:'Space Mono',monospace}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit}
.hidden{display:none !important}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
b,strong{font-weight:700}

/* ---------- HUD ---------- */
.topbar{position:sticky;top:0;z-index:60;background:rgba(10,14,20,.93);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.topbar-in{max-width:1120px;margin:0 auto;padding:9px 16px 6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.brand{font-weight:800;font-size:1rem;display:flex;align-items:center;gap:8px}
.brand .logo{font-size:1.25rem}
.spacer{flex:1}
.badge{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:var(--bg3);border:1px solid var(--border);font-size:.8rem;font-weight:600;white-space:nowrap}
.badge.acc{color:var(--accent);border-color:rgba(58,224,140,.35)}
.badge.org{color:var(--orange);border-color:rgba(255,159,67,.35)}
.badge.pulse{animation:pulse 1s ease-in-out infinite}
button.badge:hover{border-color:var(--accent)}
.hud2{max-width:1120px;margin:0 auto;padding:0 16px 9px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.xp-rank{font-size:.8rem;font-weight:700;white-space:nowrap}
.xpbar{position:relative;flex:1;min-width:140px;height:9px;background:var(--bg3);border-radius:6px;overflow:visible;border:1px solid var(--border)}
.xpfill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--gold));width:0;transition:width .6s ease}
.xpmark{position:absolute;top:-3px;width:2px;height:13px;background:var(--text3);border-radius:1px}
.xpmark.reached{background:var(--gold)}
.xp-next{font-size:.74rem;color:var(--text3);white-space:nowrap}
.navdots{display:flex;gap:6px}
.navdot{width:27px;height:27px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:800;background:var(--bg3);border:1.5px solid var(--border);color:var(--text2)}
.navdot.done{background:rgba(58,224,140,.15);border-color:var(--accent);color:var(--accent)}
.navdot.cur{border-color:var(--gold);color:var(--gold)}
.navdot.locked{opacity:.4;cursor:not-allowed}

/* ---------- LAYOUT ---------- */
.wrap{max-width:1000px;margin:0 auto;padding:18px 16px 60px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
.card+.card{margin-top:14px}
h1{font-size:1.8rem;font-weight:800;line-height:1.2}
h2{font-size:1.25rem;font-weight:800}
h3{font-size:1.02rem;font-weight:700}
.muted{color:var(--text2)}
.small{font-size:.86rem}
.tiny{font-size:.78rem}
.center{text-align:center}

/* ---------- BUTTONS ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:12px;font-weight:700;font-size:.92rem;background:var(--bg3);border:1px solid var(--border);color:var(--text);transition:transform .12s ease,background .18s ease,border-color .18s ease}
.btn:hover{transform:translateY(-2px);border-color:var(--text3)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#07130c;border:none}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--orange));color:#2b1400;border:none}
.btn-ghost{background:transparent}
.btn-acc-outline{background:transparent;border:1.5px solid var(--accent);color:var(--accent)}
.btn-acc-outline:hover{background:var(--accent);color:#07130c}
.btn-org-outline{background:transparent;border:1.5px solid var(--orange);color:var(--orange)}
.btn-org-outline:hover{background:var(--orange);color:#2b1400}
.btn-sm{padding:7px 12px;font-size:.8rem;border-radius:9px}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn-row.end{justify-content:flex-end}

/* ---------- WELCOME ---------- */
.hero{text-align:center;padding:30px 20px}
.hero .icon{font-size:3rem;line-height:1}
.hero h1{margin:12px 0 6px;font-size:2.1rem}
.hero .sub{color:var(--orange);font-weight:700;margin-bottom:12px}
.hero p{color:var(--text2);max-width:640px;margin:0 auto}
.counters{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin:22px auto 6px;max-width:720px}
.counter{background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:12px 8px}
.counter .v{font-size:1.4rem;font-weight:800;font-family:'Space Mono',monospace}
.counter .k{font-size:.74rem;color:var(--text3)}
.who{margin-top:14px;font-size:.84rem;color:var(--text2)}
.who b{color:var(--accent)}

/* ---------- PATH (hub) ---------- */
.path{position:relative;margin:18px 0 6px;padding:6px 0}
.path:before{content:'';position:absolute;left:50%;top:0;bottom:0;border-left:3px dashed var(--border);transform:translateX(-50%)}
.pnode-row{position:relative;display:flex;align-items:center;min-height:120px}
.pnode-row .pcard{width:calc(50% - 46px)}
.pnode-row.left{justify-content:flex-start}
.pnode-row.right{justify-content:flex-end}
.pnode{position:absolute;left:50%;transform:translateX(-50%);width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-family:'Space Mono',monospace;background:var(--bg3);border:3px solid var(--border);z-index:2;font-size:1rem}
.pnode.done{background:rgba(58,224,140,.18);border-color:var(--accent);color:var(--accent)}
.pnode.cur{border-color:var(--gold);color:var(--gold);box-shadow:0 0 0 0 rgba(255,209,102,.6);animation:ring 1.6s infinite}
.pnode.locked{opacity:.55}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(255,209,102,.55)}70%{box-shadow:0 0 0 14px rgba(255,209,102,0)}100%{box-shadow:0 0 0 0 rgba(255,209,102,0)}}
.pcard{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;text-align:left;transition:.16s;display:block}
button.pcard:hover{border-color:var(--gold);transform:translateY(-2px)}
.pcard.locked{opacity:.55;cursor:not-allowed}
.pcard .pi{font-size:1.5rem}
.pcard .pt{font-weight:800;font-size:.98rem;margin:2px 0}
.pcard .pd{font-size:.82rem;color:var(--text2)}
.pcard .pm{margin-top:7px;font-size:.78rem;color:var(--text3);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stars{color:var(--gold);letter-spacing:2px}
.trophies{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-top:12px}
.trophy{background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:11px;display:flex;gap:10px;align-items:flex-start}
.trophy .ti{font-size:1.6rem;line-height:1}
.trophy .tn{font-weight:700;font-size:.86rem}
.trophy .tc{font-size:.74rem;color:var(--text3)}
.trophy.off{opacity:.45;filter:grayscale(1)}
.trophy.on{border-color:rgba(255,209,102,.5);background:rgba(255,209,102,.07)}

/* ---------- BRIEF ---------- */
.brief-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.brief-h .bi{font-size:2.2rem}
.brief-h .bm{font-size:.8rem;color:var(--text3)}
.goals{background:rgba(58,224,140,.07);border:1px solid rgba(58,224,140,.3);border-radius:12px;padding:12px 14px;margin:10px 0}
.goals h3{font-size:.92rem;color:var(--accent);margin-bottom:5px}
.goals li{margin:3px 0 3px 18px;font-size:.9rem}
.theo{background:linear-gradient(135deg,rgba(74,168,255,.10),rgba(167,139,250,.07));border:1px solid rgba(74,168,255,.3);border-radius:12px;padding:12px 14px;margin:10px 0;font-size:.9rem;color:var(--text2)}
.theo h3{color:var(--blue);font-size:.92rem;margin-bottom:5px}
.theo b{color:var(--text)}
.theo ul{margin:5px 0 5px 18px}
.theo li{margin:3px 0}
.theo p+p{margin-top:6px}
.exbox{background:rgba(255,159,67,.08);border:1px solid rgba(255,159,67,.35);border-radius:12px;padding:12px 14px;margin:10px 0;font-size:.88rem;color:var(--text2)}
.exbox h3{color:var(--orange);font-size:.92rem;margin-bottom:5px}
.exbox b{color:var(--text)}
details.plus{background:rgba(255,209,102,.07);border:1px solid rgba(255,209,102,.35);border-radius:12px;padding:10px 14px;margin:10px 0;font-size:.86rem;color:var(--text2)}
details.plus summary{cursor:pointer;color:var(--gold);font-weight:700}
details.plus p{margin-top:7px}
.pred{margin:16px 0 6px;padding:14px;border-radius:12px;background:var(--bg3);border:1px solid var(--border)}
.pred h3{font-size:.95rem;margin-bottom:9px}
.pred .btn.on{border-color:var(--gold);color:var(--gold);background:rgba(255,209,102,.1)}
table.mini{width:100%;border-collapse:collapse;font-size:.82rem;margin-top:8px}
table.mini td,table.mini th{border-bottom:1px solid var(--border);padding:5px 7px;text-align:left}
table.mini th{color:var(--text3);font-size:.7rem;text-transform:uppercase;letter-spacing:.6px}
table.mini td.r,table.mini th.r{text-align:right;font-family:'Space Mono',monospace;white-space:nowrap}
.scroll{overflow-x:auto}

/* ---------- QUESTION ---------- */
.qtop{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.qtop .qm{font-weight:700;font-size:.92rem}
.qdots{display:flex;gap:6px;margin-left:auto}
.qdot{width:14px;height:14px;border-radius:50%;background:var(--bg3);border:1.5px solid var(--border)}
button.qdot{cursor:pointer}
.qdot.correct{background:var(--accent);border-color:var(--accent)}
.qdot.hint{background:var(--orange);border-color:var(--orange)}
.qdot.shown{background:var(--error);border-color:var(--error)}
.qdot.cur{background:var(--gold);border-color:var(--gold);box-shadow:0 0 8px var(--gold)}
.qtag{font-size:.74rem;font-family:'Space Mono',monospace;color:var(--text3);margin-bottom:8px}
.qtext{font-size:1.04rem;font-weight:600;margin-bottom:10px;line-height:1.5}
.qtext b{color:var(--gold)}
.data{display:block;background:var(--bg2);border:1px dashed var(--text3);border-radius:10px;padding:10px 13px;font-size:.88rem;color:var(--text2);margin:8px 0 12px;line-height:1.6}
.data b{color:var(--text)}
.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.opts{display:grid;gap:9px;margin-top:6px}
.opt{display:flex;gap:11px;align-items:flex-start;text-align:left;padding:12px 14px;border-radius:12px;background:var(--bg3);border:1.5px solid var(--border);font-size:.93rem;transition:.14s}
.opt:hover:not(:disabled){border-color:var(--blue);transform:translateX(3px)}
.opt .ol{flex:0 0 26px;height:26px;border-radius:7px;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.8rem;font-family:'Space Mono',monospace}
.opt.good{border-color:var(--accent);background:rgba(58,224,140,.11)}
.opt.bad{border-color:var(--error);background:rgba(255,95,109,.09);opacity:.8}
.opt.miss{border:1.5px dashed var(--accent)}
.opt.sel{border-color:var(--blue);background:rgba(74,168,255,.1)}
.opt:disabled{cursor:default}
.vfrow{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px}
.vfrow .opt{flex:1;min-width:140px;justify-content:center;font-weight:800;font-size:1rem}
.calcrow{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start;margin-top:6px}
.calcrow .inwrap{flex:1;min-width:200px}
.field{width:100%;background:var(--bg2);border:1.5px solid var(--border);border-radius:10px;padding:12px;color:var(--text);font-size:1rem}
.field:focus{outline:none;border-color:var(--accent)}
.field.mono{font-family:'Space Mono',monospace}
.calc-prev{font-family:'Space Mono',monospace;font-size:.8rem;color:var(--accent);min-height:1.3em;padding:4px 4px 0}
.unit{align-self:center;color:var(--text2);font-weight:700}
.appar{display:grid;gap:9px;margin-top:6px}
.arow{display:grid;grid-template-columns:minmax(150px,1fr) 2fr;gap:10px;align-items:center;background:var(--bg3);border:1.5px solid var(--border);border-radius:12px;padding:9px 11px}
.arow .at{font-weight:700;font-size:.92rem}
.arow select{width:100%;background:var(--bg2);border:1.5px solid var(--border);border-radius:9px;padding:9px;color:var(--text);font-size:.86rem}
.arow.numsel{grid-template-columns:1fr 150px}
.arow.ok1{border-color:var(--accent)} .arow.ok2{border-color:var(--orange)} .arow.ko{border-color:var(--error)}
.arow .fix{grid-column:1/-1;font-size:.82rem;color:var(--error)}
.bounce{animation:bounce .5s}
@keyframes bounce{0%,100%{transform:translateY(0)}30%{transform:translateY(-7px)}60%{transform:translateY(2px)}}
.bank{display:flex;flex-wrap:wrap;gap:8px;padding:12px;background:var(--bg2);border:1.5px dashed var(--border);border-radius:12px;min-height:58px;margin:8px 0}
.bank-l{font-size:.74rem;color:var(--text3);margin-top:6px}
.chip{padding:8px 12px;border-radius:10px;background:var(--bg3);border:1.5px solid var(--border);font-size:.86rem;font-weight:600;text-align:left;transition:.12s}
.chip:hover:not(:disabled){border-color:var(--blue)}
.chip.pick{border-color:var(--gold);background:rgba(255,209,102,.13);box-shadow:0 0 0 2px rgba(255,209,102,.25)}
.chip.ok1{border-color:var(--accent);background:rgba(58,224,140,.12)}
.chip.ok2{border-color:var(--orange);background:rgba(255,159,67,.12)}
.chip.ko{border-color:var(--error);background:rgba(255,95,109,.1)}
.chip .fix{display:block;font-size:.76rem;color:var(--error);font-weight:600;margin-top:2px}
.slots{display:grid;gap:8px;margin-top:6px}
.slot{display:flex;align-items:center;gap:10px;padding:7px 9px;border-radius:12px;background:var(--bg3);border:1.5px dashed var(--border);min-height:50px;text-align:left;width:100%}
.slot .sn{flex:0 0 28px;height:28px;border-radius:8px;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-weight:800;font-family:'Space Mono',monospace;font-size:.82rem}
.slot.target{border-color:var(--gold)}
.slot .chip{flex:1}
.slot .ph{color:var(--text3);font-size:.84rem}
.zones{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:6px}
.zone{background:var(--bg3);border:1.5px dashed var(--border);border-radius:12px;padding:10px;min-height:120px;text-align:left;width:100%;display:flex;flex-direction:column;gap:7px;align-items:stretch}
.zone.target{border-color:var(--gold)}
.zone .zt{font-weight:800;font-size:.86rem;margin-bottom:3px}

/* ---------- FEEDBACK ---------- */
.fb{border-radius:11px;padding:12px 14px;margin-top:12px;font-size:.89rem;border-left:4px solid}
.fb-ok{background:rgba(58,224,140,.10);border-color:var(--accent)}
.fb-mid{background:rgba(255,159,67,.10);border-color:var(--orange)}
.fb-bad{background:rgba(255,95,109,.09);border-color:var(--error)}
.fb-hint{background:rgba(255,201,77,.09);border-color:var(--warn)}
.fb-exp{background:rgba(74,168,255,.08);border-color:var(--blue)}
.fb h4{font-size:.92rem;margin-bottom:5px;display:flex;align-items:center;gap:7px}
.fb ul{margin:4px 0 0 17px}
.fb li{margin:4px 0;color:var(--text2)}
.fb li b{color:var(--text)}
.fb .loc{font-family:'Space Mono',monospace;background:var(--bg3);padding:1px 6px;border-radius:5px;font-size:.8em;color:var(--orange)}
.fb p{color:var(--text2)} .fb p b{color:var(--text)}
.qnav{display:flex;justify-content:flex-end;gap:10px;margin-top:14px;flex-wrap:wrap}

/* ---------- DOCUMENTS (papier) ---------- */
.doc{background:var(--paper);color:var(--ink);border-radius:10px;padding:16px;font-size:.82rem;box-shadow:0 8px 26px rgba(0,0,0,.4);border:1px solid #dcd8cc;margin:10px 0}
.doc b{color:var(--ink)}
.doc-tag{display:inline-block;font-size:.66rem;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;padding:3px 9px;border-radius:5px;background:#1d2733;color:#fff;margin-bottom:10px}
.doc-tag.ext{background:#1c5f9e}
.doc-tag.fac{background:#6b3fa0}
.doc-tag.pay{background:#25724f}
table.doc-t{width:100%;border-collapse:collapse;font-size:.79rem;min-width:430px}
table.doc-t th{background:#e9e5d8;text-align:left;padding:6px 8px;font-size:.67rem;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid #cdc7b6}
table.doc-t td{padding:6px 8px;border-bottom:1px solid #e6e2d5}
table.doc-t .r{text-align:right;font-family:'Space Mono',monospace;white-space:nowrap}
table.doc-t tr.bold td{font-weight:800;background:#f3f0e6}
table.doc-t td.q{background:#fff3c4;color:#8a5a00;font-weight:800;text-align:center}
.pay-top{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:9px;margin-bottom:9px}
.pay-emp .nm,.pay-trav .nm{font-weight:800;font-size:.95rem}
.pay-emp div,.pay-trav div{font-size:.77rem;line-height:1.4}
.pay-title{text-align:right}
.pay-title .t{font-weight:800;font-size:1.1rem;letter-spacing:1px}
.pay-title .s{font-size:.7rem;color:#7c7668;margin-bottom:3px}
.pay-title div{font-size:.77rem}
.pay-mid{display:flex;gap:14px;flex-wrap:wrap;justify-content:space-between;margin-bottom:9px}
table.pay-id{border-collapse:collapse;font-size:.76rem;flex:1;min-width:250px}
table.pay-id th{text-align:left;color:#7c7668;font-weight:700;padding:2px 10px 2px 0;white-space:nowrap;vertical-align:top}
table.pay-id td{padding:2px 0}
.pay-trav{border:1px solid #cdc7b6;border-radius:8px;padding:9px 12px;min-width:190px;align-self:flex-start}
.pay-trav .conf{font-size:.64rem;font-weight:800;letter-spacing:1.4px;color:#b0342c;margin-bottom:3px}
.pay-bot{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:9px;margin-top:10px}
.pay-bot .box{background:#efece2;border-radius:7px;padding:8px 10px;font-size:.76rem;line-height:1.45}
.doc-foot{margin-top:9px;font-size:.68rem;color:#7c7668;font-style:italic}
.doc-head{display:flex;gap:14px;flex-wrap:wrap;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:10px}
.doc-party .lbl{font-size:.62rem;text-transform:uppercase;letter-spacing:1px;color:#7c7668;font-weight:700}
.doc-party .nm{font-weight:800;font-size:.95rem}
.doc-party .ln{font-size:.77rem;line-height:1.35}
.doc-meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.doc-meta div{background:#efece2;border-radius:6px;padding:5px 9px;font-size:.75rem}
.doc-meta b{display:block;font-size:.62rem;text-transform:uppercase;letter-spacing:.7px;color:#7c7668}
table.fac-t{width:100%;border-collapse:collapse;font-size:.8rem;min-width:380px}
table.fac-t td{padding:5px 8px;border-bottom:1px solid #e6e2d5}
table.fac-t td.r{text-align:right;font-family:'Space Mono',monospace;white-space:nowrap}
table.fac-t tr.sec td{background:#e9e5d8;font-weight:800;font-size:.72rem;text-transform:uppercase;letter-spacing:.5px}
table.fac-t tr.sub td{font-weight:700;border-top:1.5px solid #9d9686}
table.fac-t tr.tot td{font-weight:800;font-size:.95rem;border-top:2px solid var(--ink)}

function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
function fmt(n){
  if(n===null || n===undefined || isNaN(n)) return '';
  const neg = n < -0.0049;
  let [i,d] = Math.abs(n).toFixed(2).split('.');
  i = i.replace(/\B(?=(\d{3})+(?!\d))/g,'.');
  return (neg?'−':'')+i+','+d;
}
function shuffled(n, seed){
  const a=[...Array(n).keys()]; let s=seed;
  for(let i=n-1;i>0;i--){ s=(s*9301+49297)%233280; const j=Math.floor(s/233280*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
/* Nombre au format belge ou international : 1.234,56 · 1234,56 · 1234.56 · 1.234 */
function normToken(t){
  if(t.includes(',') && t.includes('.')) return t.replace(/\./g,'').replace(',', '.');
  if(t.includes(',')) return t.replace(/,/g,'.');
  if(/^\d{1,3}(\.\d{3})+$/.test(t)) return t.replace(/\./g,'');
  return t;
}
function isExpr(s){ return /[+\-*/×÷()%]/.test(String(s).trim().replace(/^[-+]/,'')); }
function evalExpr(raw){
  let e = String(raw).replace(/\s|\u00a0|€/g,'').replace(/×/g,'*').replace(/÷/g,'/').replace(/[−–]/g,'-');
  if(!e) return null;
  e = e.replace(/[\d.,]+/g, normToken).replace(/(\d+(?:\.\d+)?)%/g,'($1/100)');
  if(!/^[0-9+\-*/().]+$/.test(e)) return null;
  try{ const r = Function('"use strict";return ('+e+')')(); return (typeof r==='number' && isFinite(r)) ? r : null; }
  catch(err){ return null; }
}
function parseNum(raw){
  if(raw===null || raw===undefined) return null;
  const s = String(raw).trim(); if(!s) return null;
  if(isExpr(s)){ const v = evalExpr(s); if(v!==null) return v; }
  const t = normToken(s.replace(/\s|\u00a0|€/g,''));
  const v = parseFloat(t); return isNaN(v) ? null : v;
}
function eq(a,b){ return Math.abs(a-b) <= 0.021; }
function normAcc(s){ return String(s||'').replace(/[^0-9]/g,''); }
function normPop(s){ return String(s||'').toUpperCase().replace(/[\s.\-_]/g,''); }
function normDecl(s){
  let x = String(s||'').toUpperCase().replace(/\s/g,'').replace(/[.;]/g,'');
  if(!x) return '';
  return x.split('+').filter(Boolean).map(p=>{ const m=p.match(/^(\d+)(.*)$/); return (m && m[1].length===1) ? '0'+m[1]+m[2] : p; }).sort().join('+');
}
function normDate(s){
  const m = String(s||'').trim().match(/^(\d{1,2})\s*[\/\-.]\s*(\d{1,2})/);
  if(!m) return '';
  return m[1].padStart(2,'0')+'/'+m[2].padStart(2,'0');
}
function getQ(l,q){ return LEVELS[l].questions[q]; }
function key(l,q){ return l+'_'+q; }
function S(l,q){
  const k = key(l,q);
  if(!APP.qs[k]) APP.qs[k] = initQS(getQ(l,q), l, q);
  return APP.qs[k];
}
function emptyRow(){ return {c:'',d:'',p:'',db:'',cr:''}; }
function initQS(Q,l,q){
  const seed = l*31 + q*7 + 11;
  const st = { tries:0, done:false, status:null, earned:0, showHint:false, fb:'' };
  switch(Q.type){
    case 'qcm':   st.wrong=[]; break;
    case 'vf':    st.choice=null; break;
    case 'multi': st.sel=[]; st.order=shuffled(Q.options.length, seed); break;
    case 'calc':  st.val=''; st.errHint=''; break;
    case 'appar': st.sel={}; st.lock={}; st.order = Q.numOpts ? Q.options.map((_,i)=>i) : shuffled(Q.options.length, seed); break;
    case 'ordre': st.slots=Array(Q.steps.length).fill(null); st.lock={}; st.pick=null; st.order=shuffled(Q.steps.length+Q.distract.length, seed); break;
    case 'classe':st.place={}; st.lock={}; st.pick=null; st.order=shuffled(Q.items.length, seed); break;
    case 'jrn':   st.j=''; st.d=''; st.rows=[emptyRow(),emptyRow(),emptyRow(),emptyRow(),emptyRow()];
                  st.lockHdr=false; st.lockRows={}; st.res=null; st.f1=0; break;
  }
  return st;
}
function levelUnlocked(l){ return l===0 || APP.lv[l-1].done; }
function levelPts(l){ return LEVELS[l].questions.reduce((s,_,i)=>s+((APP.qs[key(l,i)]||{}).earned||0),0); }
function levelCounts(l){

function gradeOf(r){ return r>=0.85?{g:'A',t:'Excellent'}:r>=0.65?{g:'B',t:'Très bien'}:r>=0.45?{g:'C',t:'Satisfaisant'}:{g:'D',t:'À retravailler'}; }

/* ============================================================
   ÉCRAN QUESTION
   ============================================================ */
const TAGS = { qcm:"QCM — 2 essais", vf:"Vrai / Faux — 1 essai", multi:"Sélection multiple — 2 essais",
  calc:"Réponse à écrire — 2 essais", appar:"Appariement — 2 essais", ordre:"Remise en ordre — 2 essais",
  classe:"Classement — 2 essais", jrn:"Écriture au journal — 2 essais" };

function renderQuestion(l,q){
  const lv = LEVELS[l], Q = getQ(l,q), st = S(l,q), n = lv.questions.length;
  let dots = '';
  for(let i=0;i<n;i++){
    const s = APP.qs[key(l,i)];
    const cls = 'qdot '+(i===q?'cur':(s&&s.status?s.status:''));
    const can = i===0 || S(l,i-1).done;
    dots += can ? `<button class="${cls}" onclick="goQ(${i})" aria-label="Question ${i+1}"></button>` : `<span class="${cls}"></span>`;
  }
  let h = `<div class="qtop"><button class="btn btn-sm btn-ghost" onclick="setScreen('hub')">← Parcours</button>
    <button class="btn btn-sm btn-ghost" onclick="setScreen('brief')">📘 Rappel</button>
    <span class="qm">${lv.icon} Mission ${l+1} — question ${q+1} / ${n}</span><div class="qdots">${dots}</div></div>`;
  h += `<div class="card" id="qcard"><div class="qtag">${TAGS[Q.type]} · ${Q.pts} XP</div><div class="qtext">${Q.q}</div>`;
  if(Q.data) h += `<span class="data">${Q.data}</span>`;
  if(Q.docs) Q.docs.forEach(d=> h += renderDoc(DOCS[d]));
  switch(Q.type){
    case 'qcm':   h += rQcm(Q,st); break;
    case 'vf':    h += rVf(Q,st); break;
    case 'multi': h += rMulti(Q,st); break;
    case 'calc':  h += rCalc(Q,st); break;
    case 'appar': h += rAppar(Q,st); break;
    case 'ordre': h += rOrdre(Q,st); break;
    case 'classe':h += rClasse(Q,st); break;
    case 'jrn':   h += rJrn(Q,st); break;
  }
  h += `<div id="fbHost">${fbHTML(Q,st)}</div></div>`;
  if(st.done){
    h += `<div class="qnav"><button class="btn btn-primary" onclick="nextQ()">${q<n-1?'Question suivante ➜':'Terminer la mission ➜'}</button></div>`;
  }
  return h;
}

function fbHTML(Q,st){
  let h = '';
  if(st.fb) h += st.fb;
  if(!st.done && st.showHint){
    if(Q.type==='jrn'){
      if(Q.hint) h += `<div class="fb fb-hint"><h4>💡 Piste de réflexion</h4><p>${Q.hint}</p></div>`;
      if(Q.theo) h += `<div class="fb fb-exp"><h4>📘 Rappel</h4><p>${Q.theo}</p></div>`;
    } else {
      h += `<div class="fb fb-hint"><h4>💡 Indice</h4><p>${st.errHint || Q.hint}</p></div>`;
    }
  }
  if(st.done){
    const v = st.status==='correct' ? ['fb-ok','✅ Juste du premier coup — +'+st.earned+' XP']
            : st.status==='hint' ? ['fb-mid','🔄 Corrigé au 2e essai — +'+st.earned+' XP']
            : ['fb-bad','👁 Voici la bonne réponse'+(st.earned?' — +'+st.earned+' XP':'')];
    if(Q.type==='jrn' && st.status==='shown') h += solTableHTML(Q);
    h += `<div class="fb ${v[0]}"><h4>${v[1]}</h4><p>${Q.exp}</p></div>`;
  }
  return h;
}

/* ---------- QCM ---------- */
function rQcm(Q,st){
  let h = '<div class="opts">';
  Q.options.forEach((o,i)=>{
    let cls = 'opt';
    if(st.wrong.includes(i)) cls += ' bad';
    if(st.done && i===Q.correct) cls += ' good';
    const dis = st.done || st.wrong.includes(i);
    h += `<button class="${cls}" ${dis?'disabled':''} onclick="ansQcm(${i},event)"><span class="ol">${'ABCD'[i]}</span><span>${o}</span></button>`;
  });
  return h + '</div>';
}
function ansQcm(i,ev){
  const l=APP.level, q=APP.q, Q=getQ(l,q), st=S(l,q);
  if(st.done || st.wrong.includes(i)) return;
  st.tries++;
  if(i===Q.correct){ finishQ(l,q, st.tries===1?'correct':'hint', st.tries===1?Q.pts:Math.round(Q.pts/2), ev); return; }
  st.wrong.push(i);
  if(st.tries>=2){ finishQ(l,q,'shown',0,ev); return; }
  st.showHint = true; failFirst();
}

/* ---------- VRAI / FAUX ---------- */
function rVf(Q,st){
  const b = (val,lbl)=>{
    let cls='opt';
    if(st.done){ if(val===Q.answer) cls+=' good'; else if(st.choice===val) cls+=' bad'; }
    return `<button class="${cls}" ${st.done?'disabled':''} onclick="ansVf(${val},event)">${lbl}</button>`;
  };
  return `<div class="vfrow">${b(true,'✔ Vrai')}${b(false,'✖ Faux')}</div>`;
}
function ansVf(val,ev){
  const l=APP.level, q=APP.q, Q=getQ(l,q), st=S(l,q);
  if(st.done) return;
  st.choice = val; st.tries = 1;
  if(val===Q.answer) finishQ(l,q,'correct',Q.pts,ev);
  else { failFirst(true); finishQ(l,q,'shown',0,ev); }
}

/* ---------- SÉLECTION MULTIPLE ---------- */
function rMulti(Q,st){
  let h = '<p class="tiny muted">Coche toutes les bonnes réponses, puis vérifie.</p><div class="opts">';
  st.order.forEach(i=>{
    const on = st.sel.includes(i), ok = Q.correct.includes(i);
    let cls = 'opt';
    if(st.done){ if(on && ok) cls+=' good'; else if(on && !ok) cls+=' bad'; else if(!on && ok) cls+=' miss'; }
    else if(on) cls += ' sel';
    h += `<button class="${cls}" ${st.done?'disabled':''} onclick="togMulti(${i})"><span class="ol">${on?'☑':'☐'}</span><span>${Q.options[i]}</span></button>`;
  });
  h += '</div>';
  if(!st.done) h += `<div class="btn-row end" style="margin-top:12px"><button class="btn btn-primary" onclick="checkMulti(event)" ${st.sel.length?'':'disabled'}>Vérifier (${st.tries+1}/2)</button></div>`;
  return h;
}
function togMulti(i){
  const st = S(APP.level,APP.q); if(st.done) return;
  const k = st.sel.indexOf(i); if(k>=0) st.sel.splice(k,1); else st.sel.push(i);
  renderScreen();
}
function checkMulti(ev){
  const l=APP.level, q=APP.q, Q=getQ(l,q), st=S(l,q);
  if(st.done || !st.sel.length) return;
  st.tries++;
  const ok = st.sel.length===Q.correct.length && Q.correct.every(c=>st.sel.includes(c));
  if(ok){ finishQ(l,q, st.tries===1?'correct':'hint', st.tries===1?Q.pts:Math.round(Q.pts/2), ev); return; }
  if(st.tries>=2){ finishQ(l,q,'shown',0,ev); return; }
  st.showHint = true;
  st.fb = `<div class="fb fb-bad"><h4>❌ Pas encore</h4><p>Ta sélection n'est pas complète ou contient une erreur. Modifie-la, puis vérifie à nouveau.</p></div>`;
  failFirst();
}

/* ---------- RÉPONSE À ÉCRIRE (mini-calculatrice) ---------- */
function rCalc(Q,st){
  const dis = st.done ? 'disabled' : '';
  return `<div class="calcrow"><div class="inwrap">
    <input class="field mono" id="calcIn" inputmode="decimal" autocomplete="off" placeholder="Ta réponse ou ton calcul (ex. 1200*13,07%)" value="${esc(st.val)}" ${dis}
      oninput="onCalc(this)" onkeydown="if(event.key==='Enter')checkCalc(event)">
    <div class="calc-prev" id="calcPrev">${calcPrev(st.val)}</div></div>
    <span class="unit">${Q.unit||''}</span>
    ${st.done?'':`<button class="btn btn-primary" onclick="checkCalc(event)">Vérifier (${st.tries+1}/2)</button>`}</div>
    <p class="tiny muted">Tu peux taper directement ton calcul : la mini-calculatrice affiche le résultat. Virgule ou point acceptés.</p>`;
}
function calcPrev(v){
  if(!v || !isExpr(v)) return '';
  const r = evalExpr(v);
  return r===null ? '' : String(v).replace(/\*/g,' × ').replace(/\//g,' ÷ ')+' → = '+fmt(r);
}
function onCalc(el){
  const st = S(APP.level,APP.q); st.val = el.value;
  const p = document.getElementById('calcPrev'); if(p) p.textContent = calcPrev(el.value);
}
function checkCalc(ev){
  const l=APP.level, q=APP.q, Q=getQ(l,q), st=S(l,q);
  if(st.done) return;
  const v = parseNum(st.val);
  if(v===null){ st.fb = `<div class="fb fb-hint"><h4>✏️ Réponse manquante</h4><p>Encode un nombre (ou un calcul) avant de vérifier.</p></div>`; renderScreen(); return; }
  st.tries++;
  if(eq(v,Q.answer)){ st.fb=''; finishQ(l,q, st.tries===1?'correct':'hint', st.tries===1?Q.pts:Math.round(Q.pts/2), ev); return; }
  if(st.tries>=2){
    st.fb = `<div class="fb fb-bad"><h4>❌ Ta réponse : ${fmt(v)} ${Q.unit||''}</h4><p>La bonne réponse est <b>${fmt(Q.answer)} ${Q.unit||''}</b>.</p></div>`;
    finishQ(l,q,'shown',0,ev); return;
  }
  const spec = (Q.errs||[]).find(e=>eq(v,e.v));
  st.errHint = spec ? spec.h : '';
  st.fb = `<div class="fb fb-bad"><h4>❌ ${fmt(v)} ${Q.unit||''} : ce n'est pas la bonne réponse</h4><p>Relis l'indice et recommence ton calcul.</p></div>`;
  st.showHint = true; failFirst();
}

/* ---------- ÉLÉMENTS : barème commun ---------- */
function itemFinish(l,q,n,ok1,ok2,ev){
  const Q = getQ(l,q);
  const earned = Math.round(Q.pts*(ok1+0.5*ok2)/n);
  const status = ok1===n ? 'correct' : (ok1+ok2===n ? 'hint' : 'shown');
  finishQ(l,q,status,earned,ev);
}
function countLocks(st,n){ let a=0,b=0; for(let i=0;i<n;i++){ if(st.lock[i]==='ok1')a++; else if(st.lock[i]==='ok2')b++; } return [a,b]; }
function itemFeedback(st,n){
  const ok = Object.keys(st.lock).length;
  st.fb = `<div class="fb fb-bad"><h4>🔒 ${ok} élément${ok>1?'s':''} sur ${n} ${ok>1?'sont':'est'} juste${ok>1?'s':''}</h4><p>Les éléments justes sont verrouillés en vert. Les autres sont revenus à leur place de départ : réessaie (dernier essai).</p></div>`;
}

/* ---------- APPARIEMENT ---------- */
function rAppar(Q,st){
  let h = '<div class="appar">';
  Q.items.forEach((it,i)=>{
    const lk = st.lock[i];
    const cls = 'arow'+(Q.numOpts?' numsel':'')+(lk?' '+lk:'')+(st.bounce && st.bounce.includes(i)?' bounce':'');
    let sel = `<select ${lk||st.done?'disabled':''} onchange="setAppar(${i},this.value)" aria-label="${esc(it.t)}"><option value="">— Choisis —</option>`;
    st.order.forEach(k=>{ const o=Q.options[k]; sel += `<option value="${o.k}" ${st.sel[i]===o.k?'selected':''}>${esc(o.t)}</option>`; });
    sel += '</select>';
    const good = Q.options.find(o=>o.k===it.a);
    h += `<div class="${cls}"><div class="at">${it.t}</div>${sel}${lk==='ko'?`<div class="fix">✏️ correction : ${good.t}</div>`:''}</div>`;
  });
  h += '</div>';
  const all = Q.items.every((_,i)=>st.sel[i]);
  if(!st.done) h += `<div class="btn-row end" style="margin-top:12px"><button class="btn btn-primary" onclick="checkAppar(event)" ${all?'':'disabled'}>Vérifier (${st.tries+1}/2)</button></div>`;
  st.bounce = null;
  return h;
}
function setAppar(i,v){ const st=S(APP.level,APP.q); st.sel[i]=v; renderScreen(); }
function checkAppar(ev){
  const l=APP.level, q=APP.q, Q=getQ(l,q), st=S(l,q), n=Q.items.length;
  if(st.done) return;
  st.tries++; st.bounce=[];
  Q.items.forEach((it,i)=>{
    if(st.lock[i]) return;
    if(st.sel[i]===it.a) st.lock[i] = st.tries===1 ? 'ok1' : 'ok2';
    else if(st.tries===1){ st.sel[i]=''; st.bounce.push(i); }
    else st.lock[i] = 'ko';
  });
  const [a,b] = countLocks(st,n);
  if(a===n || st.tries>=2){ st.fb=''; itemFinish(l,q,n,a,b,ev); return; }
  itemFeedback(st,n); st.showHint=true; failFirst();
}

/* ---------- REMISE EN ORDRE ---------- */
function ordreLabel(Q,k){ return k<Q.steps.length ? Q.steps[k] : Q.distract[k-Q.steps.length]; }
function rOrdre(Q,st){
  const placed = st.slots.filter(x=>x!==null);
  let h = '<div class="bank-l">Étiquettes disponibles — clique une étiquette, puis l\'emplacement où la placer :</div><div class="bank">';
  st.order.forEach(k=>{
    if(placed.includes(k)) return;
    h += `<button class="chip${st.pick===k?' pick':''}" ${st.done?'disabled':''} onclick="pickOrdre(${k})">${ordreLabel(Q,k)}</button>`;
  });
  h += '</div><div class="slots">';
  st.slots.forEach((k,i)=>{
    const lk = st.lock[i];
    let inner = '<span class="ph">emplacement vide</span>';
    if(k!==null) inner = `<span class="chip ${lk||''}">${ordreLabel(Q,k)}${lk==='ko'?`<span class="fix">→ ${Q.steps[i]}</span>`:''}</span>`;
    else if(lk==='ko') inner = `<span class="chip ko">—<span class="fix">→ ${Q.steps[i]}</span></span>`;
    const cls = 'slot'+(st.pick!==null && !lk?' target':'')+(st.bounce && st.bounce.includes(i)?' bounce':'');
    h += `<button class="${cls}" ${lk||st.done?'disabled':''} onclick="slotOrdre(${i})"><span class="sn">${i+1}</span>${inner}</button>`;
  });
  h += '</div>';
  const full = st.slots.every(x=>x!==null);
  if(!st.done) h += `<div class="btn-row end" style="margin-top:12px"><button class="btn btn-primary" onclick="checkOrdre(event)" ${full?'':'disabled'}>Vérifier (${st.tries+1}/2)</button></div>`;
  st.bounce = null;
  return h;
}
function pickOrdre(k){ const st=S(APP.level,APP.q); st.pick = st.pick===k ? null : k; renderScreen(); }
function slotOrdre(i){
  const st=S(APP.level,APP.q); if(st.lock[i]) return;
  if(st.pick!==null){ st.slots[i] = st.pick; st.pick = null; }
  else if(st.slots[i]!==null){ st.pick = st.slots[i]; st.slots[i] = null; }
  renderScreen();
}
function checkOrdre(ev){
  const l=APP.level, q=APP.q, Q=getQ(l,q), st=S(l,q), n=Q.steps.length;
  if(st.done || st.slots.some(x=>x===null)) return;
  st.tries++; st.bounce=[]; st.pick=null;
  st.slots.forEach((k,i)=>{
    if(st.lock[i]) return;
    if(k===i) st.lock[i] = st.tries===1 ? 'ok1' : 'ok2';
    else if(st.tries===1){ st.slots[i]=null; st.bounce.push(i); }
    else st.lock[i] = 'ko';
  });
  const [a,b] = countLocks(st,n);
  if(a===n || st.tries>=2){ st.fb=''; itemFinish(l,q,n,a,b,ev); return; }
  itemFeedback(st,n); st.showHint=true; failFirst();
}

/* ---------- CLASSEMENT PAR ZONES ---------- */
function rClasse(Q,st){
  let h = '<div class="bank-l">Éléments à classer — clique un élément, puis la zone qui lui correspond :</div><div class="bank">';
  let left = 0;
  st.order.forEach(i=>{
    if(st.place[i]) return; left++;
    h += `<button class="chip${st.pick===i?' pick':''}" ${st.done?'disabled':''} onclick="pickClasse(${i})">${Q.items[i].t}</button>`;
  });
  if(!left) h += '<span class="tiny muted">Tous les éléments sont placés.</span>';
  h += '</div><div class="zones">';
  Q.zones.forEach(z=>{
    let inner = '';
    st.order.forEach(i=>{
      if(st.place[i]!==z.k) return;
      const lk = st.lock[i];
      const zt = Q.zones.find(x=>x.k===Q.items[i].z).t;
      inner += `<span class="chip ${lk||''}${st.bounce&&st.bounce.includes(i)?' bounce':''}" ${lk||st.done?'':`onclick="event.stopPropagation();unplaceClasse(${i})"`} role="button">${Q.items[i].t}${lk==='ko'?`<span class="fix">→ ${zt}</span>`:''}</span>`;
    });
    h += `<button class="zone${st.pick!==null?' target':''}" ${st.done?'disabled':''} onclick="zoneClasse('${z.k}')"><span class="zt">${z.t}</span>${inner}</button>`;
  });
  h += '</div>';
  const full = Q.items.every((_,i)=>st.place[i]);
  if(!st.done) h += `<div class="btn-row end" style="margin-top:12px"><button class="btn btn-primary" onclick="checkClasse(event)" ${full?'':'disabled'}>Vérifier (${st.tries+1}/2)</button></div>`;
  st.bounce = null;
  return h;
}
function pickClasse(i){ const st=S(APP.level,APP.q); st.pick = st.pick===i ? null : i; renderScreen(); }
function zoneClasse(z){ const st=S(APP.level,APP.q); if(st.pick===null) return; st.place[st.pick]=z; st.pick=null; renderScreen(); }
function unplaceClasse(i){ const st=S(APP.level,APP.q); if(st.lock[i]) return; delete st.place[i]; st.pick=i; renderScreen(); }
function checkClasse(ev){
  const l=APP.level, q=APP.q, Q=getQ(l,q), st=S(l,q), n=Q.items.length;
  if(st.done || !Q.items.every((_,i)=>st.place[i])) return;
  st.tries++; st.bounce=[]; st.pick=null;
  Q.items.forEach((it,i)=>{
    if(st.lock[i]) return;
    if(st.place[i]===it.z) st.lock[i] = st.tries===1 ? 'ok1' : 'ok2';
    else if(st.tries===1){ delete st.place[i]; st.bounce.push(i); }
    else st.lock[i] = 'ko';
  });
  const [a,b] = countLocks(st,n);
  if(a===n || st.tries>=2){ st.fb=''; itemFinish(l,q,n,a,b,ev); return; }
  itemFeedback(st,n); st.showHint=true; failFirst();
}

function amtHint(v){ if(!v || !isExpr(v)) return ''; const r = evalExpr(v); return r===null ? '' : '= '+fmt(r)+' €'; }
function totHTML(st){

}

function addRow(){ const st=curJ(); if(st.done) return; st.rows.push(emptyRow()); renderScreen(); }
function delRow(ri){
  const st=curJ(); if(st.done || st.lockRows[ri] || st.rows.length<=1) return;
  st.rows.splice(ri,1);
  const nl={}; Object.keys(st.lockRows).forEach(k=>{ k=+k; if(k<ri) nl[k]=true; else if(k>ri) nl[k-1]=true; }); st.lockRows=nl;
  if(st.res) st.res.cells.splice(ri,1);
  renderScreen();
}
function clearJrn(){
  const st=curJ(); if(st.done) return;
  if(!st.lockHdr){ st.j=''; st.d=''; }
  st.rows = st.rows.map((r,i)=> st.lockRows[i] ? r : emptyRow());
  st.res = st.res ? Object.assign({}, st.res, {cells: st.rows.map((_,i)=> st.lockRows[i] ? (st.res.cells[i]||{}) : {})}) : null;
  renderScreen();
}

/* Moteur de correction — ordre libre, lignes d'un même compte regroupées (ex. 4540 en plusieurs lignes) */
function correctJ(st, sol){
  const res = { errs:[], cells:st.rows.map(()=>({})), hdrJ:false, hdrD:false, okEl:0, nEl:1+sol.l.length, extra:0, rowOk:{}, formErr:false };
  const err = (loc,txt)=>{ if(!res.errs.some(e=>e.loc===loc && e.txt===txt)) res.errs.push({loc,txt}); };
  res.hdrJ = st.j===sol.j;
  res.hdrD = sol.d.includes(normDate(st.d));
  if(!res.hdrJ) err('Journal', "ce journal ne convient pas à cette pièce.");
  if(!res.hdrD) err('Date', st.d ? "la date ne correspond pas à celle de la pièce (ou de l'énoncé)." : "la date est manquante.");
  if(res.hdrJ && res.hdrD) res.okEl++;

  const used = [];
  st.rows.forEach((r,i)=>{
    const acc=normAcc(r.c), db=parseNum(r.db), cr=parseNum(r.cr), decl=normDecl(r.d), pop=normPop(r.p);
    if(!acc && db===null && cr===null && !decl && !pop) return;
    used.push({ i, acc, decl, pop, db:db||0, cr:cr||0, bad:false });
  });
  const SL = sol.l.map(s=>({ acc:s.c, sens:(s.db!=null?'D':'C'), amt:(s.db!=null?s.db:s.cr),
    decl:(s.dAlt||[s.d||'']).map(normDecl), pop:(s.pAlt||[s.p||'']).map(normPop), g:null }));
  used.forEach(u=>{
    const c = res.cells[u.i];
    if(!u.acc){ c.c=false; u.bad=true; err('ligne '+(u.i+1), "le numéro de compte est manquant."); }
    else if(u.acc.length!==4){ c.c=false; u.bad=true; err(u.acc, "un compte du PCMN comporte exactement 4 chiffres."); }
    else if(!PCMN[u.acc]){ c.c=false; u.bad=true; err(u.acc, "ce numéro n'existe pas dans le plan comptable. Ouvre 📖 Plan comptable pour vérifier."); }
    if(u.db && u.cr){ c.db=false; c.cr=false; u.bad=true; err(u.acc||('ligne '+(u.i+1)), "une même ligne ne peut pas être à la fois au débit ET au crédit."); }
    else if(u.acc && !u.db && !u.cr){ c.db=false; c.cr=false; u.bad=true; err(u.acc, "aucun montant n'est encodé sur cette ligne."); }
    if(u.bad){ res.formErr = true; if(!SL.some(s=>s.acc===u.acc)) res.extra++; }
  });

  const groups = {};
  used.forEach(u=>{
    if(u.bad) return;
    const sens = u.db ? 'D' : 'C', k = u.acc+'|'+sens;
    (groups[k] = groups[k] || {acc:u.acc, sens, amt:0, rows:[], m:null});
    groups[k].amt += (sens==='D' ? u.db : u.cr); groups[k].rows.push(u);
  });
  const G = Object.values(groups);
  const pass = test => SL.forEach(s=>{ if(s.g) return; const g = G.find(g=>!g.m && test(g,s)); if(g){ s.g=g; g.m=s; } });
  pass((g,s)=> g.acc===s.acc && g.sens===s.sens && eq(g.amt,s.amt));
  pass((g,s)=> g.acc===s.acc && g.sens===s.sens);
  pass((g,s)=> g.acc===s.acc);

  SL.forEach(s=>{
    if(!s.g) return;
    const g = s.g; let ok = true;
    g.rows.forEach(u=>{ res.cells[u.i].c = true; });
    if(g.sens!==s.sens){
      ok=false; g.rows.forEach(u=>{ res.cells[u.i].db=false; res.cells[u.i].cr=false; });
      err(s.acc, "le sens est inversé : ce montant n'est pas du bon côté (débit / crédit).");
    } else if(!eq(g.amt,s.amt)){
      ok=false; g.rows.forEach(u=>{ res.cells[u.i][s.sens==='D'?'db':'cr'] = false; });
      err(s.acc, g.rows.length>1 ? "le total des lignes de ce compte n'est pas correct." : "le montant n'est pas correct. Recalcule-le à partir du document.");
    } else g.rows.forEach(u=>{ res.cells[u.i][s.sens==='D'?'db':'cr'] = true; });
    g.rows.forEach(u=>{
      if(!s.decl.includes(u.decl)){ ok=false; res.cells[u.i].d=false;
        err(s.acc, s.decl[0]==='' ? "aucune grille de la déclaration TVA ne doit figurer sur cette ligne." : "la grille de la déclaration TVA n'est pas correcte (ou manque). Ouvre 📋 Grilles TVA."); }
      else if(u.decl) res.cells[u.i].d = true;
      if(!s.pop.includes(u.pop)){ ok=false; res.cells[u.i].p=false;
        err(s.acc, s.pop[0]==='' ? "aucun code Popsy ne doit figurer sur cette ligne." : "le code Popsy n'est pas correct (ou manque). Ouvre ⚙️ Codes Popsy."); }
      else if(u.pop) res.cells[u.i].p = true;
    });
    if(ok){ res.okEl++; g.rows.forEach(u=>{ res.rowOk[u.i]=true; }); }
  });
  G.forEach(g=>{
    if(g.m) return;
    res.extra++;
    g.rows.forEach(u=>{ res.cells[u.i].c=false; });
    err(g.acc, SL.some(s=>s.acc===g.acc) ? "ce compte apparaît des deux côtés : vérifie le sens de chaque ligne." : "ce compte ne fait pas partie de cette écriture.");
  });
  const missing = SL.filter(s=>!s.g).length;
  if(missing) err('', `Il manque <b>${missing} ligne${missing>1?'s':''}</b> à cette écriture.`);
  let tD=0,tC=0; used.forEach(u=>{ tD+=u.db; tC+=u.cr; });
  if(!eq(tD,tC)) res.balMsg = `Contrôle d'équilibre : total débit <b>${fmt(tD)} €</b> ≠ total crédit <b>${fmt(tC)} €</b>. Dans toute écriture, débit = crédit.`;
  res.ok = res.okEl===res.nEl && res.extra===0 && !res.formErr && missing===0;
  res.ratio = res.okEl / (res.nEl + res.extra);
  return res;
}
function errListHTML(res){
  let h = `<div class="fb fb-bad"><h4>❌ À corriger — voici où</h4><ul>`;
  res.errs.forEach(e=>{ h += `<li>${e.loc?`<span class="loc">${e.loc}</span> `:''}${e.txt}</li>`; });
  h += '</ul>';
  if(res.balMsg) h += `<p class="small" style="margin-top:8px;color:var(--warn)">⚖️ ${res.balMsg}</p>`;
  return h + `<p class="tiny" style="margin-top:8px">Ce qui est juste est verrouillé en vert ; les cases fautives sont encadrées en rouge. Corrige-les, puis vérifie une dernière fois.</p></div>`;
}
function checkJrn(ev){
  const l=APP.level, q=APP.q, Q=getQ(l,q), st=S(l,q);
  if(st.done) return;
  const filled = st.rows.some(r=>normAcc(r.c) || parseNum(r.db)!==null || parseNum(r.cr)!==null);
  if(!st.j || !st.d.trim() || !filled){
    st.fb = `<div class="fb fb-hint"><h4>✏️ Écriture incomplète</h4><p>Choisis le journal, encode la date et au moins une ligne avant de vérifier. Aucun essai n'est compté.</p></div>`;
    renderScreen(); return;
  }
  st.tries++;
  const res = correctJ(st, Q.sol); st.res = res;
  if(res.ok){
    const earned = st.tries===1 ? Q.pts : Math.round(Q.pts*(st.f1 + 0.5*(1-st.f1)));
    st.fb=''; finishQ(l,q, st.tries===1?'correct':'hint', earned, ev); return;
  }
  if(st.tries===1){
    st.f1 = res.ratio;
    if(res.hdrJ && res.hdrD) st.lockHdr = true;
    Object.keys(res.rowOk).forEach(i=>{ st.lockRows[i]=true; });
    st.fb = errListHTML(res); st.showHint = true; failFirst(); return;
  }
  const earned = Math.round(Q.pts*(st.f1 + 0.5*Math.max(0, res.ratio - st.f1)));
  st.fb = errListHTML(res).replace('À corriger — voici où','Encore des erreurs');
  finishQ(l,q,'shown',earned,ev);
}

   SCORE, SÉRIE, EFFETS
   ============================================================ */
function finishQ(l,q,status,earned,ev){
  const st = S(l,q), Q = getQ(l,q);
  st.done = true; st.status = status; st.earned = earned; st.showHint = false;
  APP.score += earned;
  if(status==='correct'){
    APP.streak++; APP.bestStreak = Math.max(APP.bestStreak, APP.streak);
    sfx('ok');
    if(APP.streak>=3) comboFlash(APP.streak);
  } else if(status==='hint'){ sfx('ok'); }
  if(earned>0) burst(ev, earned);
  if(Q.badge && status==='correct') award(Q.badge);
  if(APP.bestStreak>=5) award('streak5');
  renderScreen();
  checkRank();
}
function failFirst(silent){
  APP.streak = 0;
  if(!silent) sfx('ko');
  renderScreen();
  const c = document.getElementById('qcard');
  if(c){ c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake'); }
}
function evPoint(ev){
  if(ev && ev.clientX) return {x:ev.clientX, y:ev.clientY};
  const t = ev && ev.target && ev.target.getBoundingClientRect ? ev.target.getBoundingClientRect() : null;
  if(t && t.width) return {x:t.left+t.width/2, y:t.top+t.height/2};
  return {x:window.innerWidth/2, y:window.innerHeight/2};
}
function burst(ev, pts){
  const p = evPoint(ev), cols = ['#3ae08c','#ffd166','#ff9f43','#4aa8ff','#a78bfa'];
  for(let i=0;i<16;i++){
    const d = document.createElement('div'); d.className='particle';
    const a = Math.PI*2*i/16, r = 50+Math.random()*50;
    d.style.left = p.x+'px'; d.style.top = p.y+'px'; d.style.background = cols[i%cols.length];
    d.style.setProperty('--dx', Math.cos(a)*r+'px'); d.style.setProperty('--dy', Math.sin(a)*r+'px');
    document.body.appendChild(d); setTimeout(()=>d.remove(), 900);
  }
  const f = document.createElement('div'); f.className='floatxp'; f.textContent = '+'+pts+' XP';
  f.style.left = (p.x-24)+'px'; f.style.top = (p.y-30)+'px';
  document.body.appendChild(f); setTimeout(()=>f.remove(), 1200);
}
function comboFlash(n){
  const t = n>=10 ? '⚡ INARRÊTABLE ×'+n : n>=5 ? '🔥 EN FEU ×'+n : '🔥 COMBO ×'+n;
  const d = document.createElement('div'); d.className='combo'; d.textContent = t;
  document.body.appendChild(d); setTimeout(()=>d.remove(), 1200);
}
function confetti(){
  const cols = ['#3ae08c','#ffd166','#ff9f43','#4aa8ff','#a78bfa','#ff5f6d'];
  for(let i=0;i<90;i++){
    const c = document.createElement('div'); c.className='confetti';
    c.style.left = Math.random()*100+'vw'; c.style.background = cols[i%cols.length];
    c.style.animationDuration = (2.2+Math.random()*2)+'s'; c.style.animationDelay = (Math.random()*.6)+'s';
    document.body.appendChild(c); setTimeout(()=>c.remove(), 5200);
  }
}

const FX = { queue:[], busy:false };
function pushFx(fn){ FX.queue.push(fn); if(!FX.busy) nextFx(); }
function nextFx(){ const fn = FX.queue.shift(); if(!fn){ FX.busy=false; return; } FX.busy=true; fn(); }
function checkRank(){
  const ri = rankIndex(APP.score);
  if(ri > APP.rankIdx){
    APP.rankIdx = ri; const r = RANKS[ri];
    pushFx(()=>{
      sfx('rank');

      document.body.appendChild(d); confetti();
    });
  }
}

/* ---------- Badges (bandeau 3 s, file d'attente) ---------- */
const TOASTS = { queue:[], busy:false };
function award(id){
  if(APP.badges.has(id)) return;
  APP.badges.add(id);
  const b = BADGES.find(x=>x.id===id); TOASTS.queue.push(b); if(!TOASTS.busy) nextToast();
}
function nextToast(){
  const b = TOASTS.queue.shift(); if(!b){ TOASTS.busy=false; return; }
  TOASTS.busy = true; sfx('badge');
  const host = document.getElementById('toastHost');
  const t = document.createElement('div'); t.className='toast';
  t.innerHTML = `<div class="ti">${b.i}</div><div><div class="tt">BADGE DÉBLOQUÉ</div><div class="tn">${b.n}</div></div>`;
  host.appendChild(t);
  setTimeout(()=>{ t.remove(); nextToast(); }, 3000);
}

/* ---------- Sons (Web Audio, coupés par défaut) ---------- */
let AC = null;
function toggleSound(){
  APP.sound = !APP.sound;
  if(APP.sound && !AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ AC=null; } }
  updateHUD();
}
function tone(freq,start,dur,type,vol){
  if(!AC) return;
  const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime+start;
  o.type = type||'sine'; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||0.15,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+dur+0.05);
}
function sfx(k){
  if(!APP.sound || !AC) return;
  if(k==='ok'){ tone(660,0,.12); tone(990,.1,.18); }
  else if(k==='ko'){ tone(220,0,.22,'triangle',.12); }
  else if(k==='badge'){ tone(784,0,.12); tone(988,.1,.12); tone(1319,.2,.25); }
  else if(k==='rank' || k==='level'){ [523,659,784,1047].forEach((f,i)=>tone(f,i*.11,.22)); }
}

function predOf(l){
  const n = LEVELS[l].questions.length, c = levelCounts(l), r = c.correct/n;
  return r===1 ? 'all' : (r>=0.625 ? 'tq' : 'half');
}
function completeLevel(l){
  const st = APP.lv[l];
  if(!st.done){
    st.done = true;
    const res = stopExerciseTimer(l);
    if(!APP.sent.has(l)){
      APP.sent.add(l);
      sendResult('Mission '+(l+1)+' — '+LEVELS[l].title, res ? res.points : levelPts(l), LEVELS[l].maxPoints, res ? res.temps : 0);
    }
    const n = LEVELS[l].questions.length, c = levelCounts(l);
    if(l===0) award('first');
    if(c.correct===n) award('perfect');
    if(st.pred && st.pred===predOf(l)) award('pred');
    if(APP.lv.every(s=>s.done)){
      award('all');
      if(APP.score >= 0.85*TOTAL_XP) award('prec');
    }
    sfx('level');
    if(c.correct/n >= 0.7) confetti();
  }
  APP.level = l; setScreen('bilan');
}

/* ---------- Bilan par critères et indicateurs (§4.11) ---------- */
function bilanIndicateurs(){
  const acc = {};
  LEVELS.forEach((lv,l)=> lv.questions.forEach((q,i)=>{
    const a = acc[q.ind] || (acc[q.ind] = {pts:0, max:0});
    a.max += q.pts; a.pts += (APP.qs[key(l,i)] && APP.qs[key(l,i)].earned) || 0;
  }));
  const statut = r => r>=0.8 ? 'atteint' : r>=0.5 ? 'encours' : 'nonatteint';
  return CRITERES.map(c=>{
    const inds = c.indicateurs.map(ind=>{ const a = acc[ind.id]||{pts:0,max:0}; const r = a.max ? a.pts/a.max : 0; return Object.assign({}, ind, {ratio:r, statut:statut(r)}); });
    const tot = c.indicateurs.reduce((t,ind)=>{ const a=acc[ind.id]||{pts:0,max:0}; return {pts:t.pts+a.pts, max:t.max+a.max}; }, {pts:0,max:0});
    const r = tot.max ? tot.pts/tot.max : 0;
    return { id:c.id, nom:c.nom, ratio:r, statut:statut(r), indicateurs:inds };
  });
}
const ST_LBL = { atteint:'✅ Atteint', encours:'🟠 En cours d\'acquisition', nonatteint:'❌ Non atteint' };
function chapTxt(ind){ return ind.chapitres.map(c=>'« '+c+' »').join(' et '); }

  const B = bilanIndicateurs();

    <div class="grade"><div class="medal">${medalOf(r1)}</div><h2>🏁 Bilan final</h2><div class="gr">${gr.g} — ${gr.t}</div>

    <h3 style="margin-top:18px">🎯 Ce que tu maîtrises</h3>${crit}

  const cbName = '_emailCb_' + Date.now();
  const offline = msg => { errDiv.innerHTML = msg + ` <button class="btn btn-sm btn-ghost" onclick="offlineMode()">Continuer sans enregistrement</button>`; btn.textContent='✅ Vérifier et commencer'; btn.disabled=false; };
  const timeout = setTimeout(()=>{ delete window[cbName]; const s=document.getElementById(cbName); if(s) s.remove(); offline('⚠️ Connexion impossible. Vérifie ta connexion internet.'); }, 10000);
  window[cbName] = function(resp){
    clearTimeout(timeout); delete window[cbName];
    const s = document.getElementById(cbName); if(s) s.remove();
    btn.textContent = '✅ Vérifier et commencer'; btn.disabled = false;
    if(resp && resp.found){
      const oldEmail = localStorage.getItem('student_email');
      localStorage.setItem('student_email', email); localStorage.setItem('student_classe', resp.classe || '');
      APP.email = email; APP.classe = resp.classe || '';
      if(oldEmail && oldEmail !== email) resetProgression();
      TRACKING.sessionId = new Date().toISOString();
      closeModal(); startGlobalTimer(); setScreen('welcome');
    } else {
      errDiv.textContent = "⚠️ Cette adresse e-mail n'est pas enregistrée. Vérifie l'orthographe ou demande à ton professeur de t'ajouter à la liste.";
    }
  };
  const s = document.createElement('script');
  s.id = cbName;
  s.src = `${TRACKING.scriptUrl}?action=check_email&email=${encodeURIComponent(email)}&callback=${cbName}`;
  s.onerror = ()=>{ clearTimeout(timeout); delete window[cbName]; s.remove(); offline('⚠️ Erreur de connexion au serveur.'); };
  document.body.appendChild(s);
}
function offlineMode(){
  APP.email = ''; APP.classe = '';
  TRACKING.sessionId = new Date().toISOString();
  closeModal(); startGlobalTimer(); setScreen('welcome');
}
function resetProgression(){ resetState(); }
function startGlobalTimer(){
  APP.globalTimerStart = Date.now();
  const el = document.getElementById('globalTimer'); if(el) el.style.display = 'inline-flex';
  if(APP.globalTimerInterval) clearInterval(APP.globalTimerInterval);
  APP.globalTimerInterval = setInterval(updateTimerDisplay, 1000); updateTimerDisplay();
}
function updateTimerDisplay(){
  const el = document.getElementById('globalTimer'); if(!el || !APP.globalTimerStart) return;
  const e = Math.floor((Date.now()-APP.globalTimerStart)/1000);
  el.textContent = '⏱️ '+String(Math.floor(e/60)).padStart(2,'0')+':'+String(e%60).padStart(2,'0');
}
function startExerciseTimer(idx){ APP.exerciseStartTime = Date.now(); APP.scoreBeforeExercise = APP.score || 0; }
function stopExerciseTimer(idx){
  if(!APP.exerciseStartTime) return null;
  const tempsSec = Math.round((Date.now()-APP.exerciseStartTime)/1000);
  APP.exerciseTimes[idx] = tempsSec; APP.exerciseStartTime = null;
  const deltaPoints = (APP.score||0) - APP.scoreBeforeExercise;
  APP.exerciseScores[idx] = deltaPoints;
  return { points:deltaPoints, temps:tempsSec };
}
function sendResult(niveau, points, pointsMax, temps){
  if(!APP.email) return;
  const payload = { email:APP.email, classe:APP.classe, app:TRACKING.appName, niveau, points, pointsMax, temps,
                    totalNiveaux:TRACKING.totalNiveaux, sessionId:TRACKING.sessionId };
  try{
    fetch(TRACKING.scriptUrl, { method:"POST", mode:"no-cors", headers:{ "Content-Type":"text/plain" }, body:JSON.stringify(payload) })
      .catch(err=>console.warn('[TRACKING] Erreur :', err));
  }catch(e){ console.warn('[TRACKING]', e); }
}

/* ---------- Classements ---------- */
let currentLBTab = 'app';
function openLB(tab){ document.getElementById('lbOverlay').style.display = 'block'; switchLBTab(tab||'app'); }
function closeLB(){ document.getElementById('lbOverlay').style.display = 'none'; }
function switchLBTab(tab){
  currentLBTab = tab;
  const a = document.getElementById('lbTabApp'), g = document.getElementById('lbTabGlobal');
  a.style.cssText = tab==='app' ? 'background:var(--accent);color:#07130c;border:1px solid var(--accent)' : 'background:transparent;color:var(--accent);border:1px solid var(--accent)';
  g.style.cssText = tab==='global' ? 'background:var(--orange);color:#2b1400;border:1px solid var(--orange)' : 'background:transparent;color:var(--orange);border:1px solid var(--orange)';
  const cl = APP.classe ? ' ('+APP.classe+')' : '';
  document.getElementById('lbTitle').textContent = tab==='app' ? '🏆 Classement — '+TRACKING.appName+cl : '🌍 Classement général'+cl;
  fetchLeaderboard(tab);
}
function fetchLeaderboard(tab){
  const content = document.getElementById('lbContent');
  content.innerHTML = '<div class="center muted" style="padding:40px">⏳ Chargement…</div>';
  const action = tab==='app' ? 'leaderboard_app' : 'leaderboard_global';
  const cbName = '_lbCb_' + Date.now();
  const timeout = setTimeout(()=>{
    delete window[cbName]; const s=document.getElementById(cbName); if(s) s.remove();
    content.innerHTML = `<div class="center" style="padding:40px"><div style="color:var(--error);margin-bottom:12px">⚠️ Connexion impossible</div><button class="btn btn-sm" onclick="fetchLeaderboard('${tab}')">Réessayer</button></div>`;
  }, 10000);
  window[cbName] = function(resp){
    clearTimeout(timeout); delete window[cbName];
    const s=document.getElementById(cbName); if(s) s.remove();
    const lbData = resp && (resp.leaderboard || resp.data);
    if(!lbData || lbData.length===0){ content.innerHTML = '<div class="center muted" style="padding:40px">🏁 Aucun résultat pour le moment</div>'; return; }
    renderLeaderboard(lbData, tab);
  };
  let url = `${TRACKING.scriptUrl}?action=${action}&callback=${cbName}&mode=last`;
  if(tab==='app') url += `&app=${encodeURIComponent(TRACKING.appName)}`;
  if(APP.classe) url += `&classe=${encodeURIComponent(APP.classe)}`;
  const s = document.createElement('script'); s.id = cbName; s.src = url;
  s.onerror = ()=>{ clearTimeout(timeout); delete window[cbName]; s.remove(); content.innerHTML = '<div class="center" style="padding:40px;color:var(--error)">⚠️ Erreur de connexion</div>'; };
  document.body.appendChild(s);
}
function renderLeaderboard(data, tab){
  const content = document.getElementById('lbContent'), myEmail = (APP.email||'').toLowerCase();
  if(tab==='global' && data.length>0){
    data = data.slice().sort((a,b)=>{ const pa=(a.pct!=null?a.pct:(a.pourcentage||0)), pb=(b.pct!=null?b.pct:(b.pourcentage||0)); if(pb!==pa) return pb-pa; return (a.totalTemps||a.totalTime||0)-(b.totalTemps||b.totalTime||0); });
    data.forEach((e,i)=>{ e.rang = i+1; });
  }
  const me = data.find(r=>(r.email||'').toLowerCase()===myEmail);
  let html = '';
  if(me){
    const pct = me.pct!=null ? me.pct : (me.pourcentage||0);
    const count = tab==='app' ? (me.niveauxCompletes||me.niveaux||0) : (me.appsCompletes||me.apps||0);
    const total = tab==='app' ? (me.totalNiveaux||TRACKING.totalNiveaux||0) : (me.totalPossibleNiveaux||0);
    const label = tab==='app' ? 'missions' : 'apps';
    html += `<div style="background:rgba(58,224,140,.08);border:1px solid rgba(58,224,140,.3);border-radius:12px;padding:14px;margin-bottom:14px;display:flex;justify-content:space-around;text-align:center;flex-wrap:wrap;gap:8px">
      <div><div style="font-size:1.3rem;font-weight:800;color:var(--accent)">#${me.rang}</div><div class="tiny muted">RANG</div></div>
      <div><div style="font-size:1.3rem;font-weight:800">${me.totalPoints}</div><div class="tiny muted">POINTS</div></div>
      <div><div style="font-size:1.3rem;font-weight:800;color:${pct>=80?'var(--accent)':pct>=50?'var(--orange)':'var(--error)'}">${pct}%</div><div class="tiny muted">RÉUSSITE</div></div>
      <div><div style="font-size:1.3rem;font-weight:800;color:var(--text2)">${total>0?count+'/'+total:count} ${label}</div><div class="tiny muted">PROGRESSION</div></div></div>`;
  }
  const medals = ['🥇','🥈','🥉'];
  html += '<table class="bilan"><thead><tr><th>#</th><th>Élève</th><th class="c">Pts</th><th class="c">%</th><th class="c">Progression</th><th class="c">Temps</th></tr></thead><tbody>';
  data.forEach(row=>{
    const r = row.rang||0, em = (row.email||'');
    const name = em.split('@')[0].split(/[._-]/).map(w=>w.charAt(0).toUpperCase()+w.slice(1)).join(' ');
    const pct = row.pct!=null ? row.pct : (row.pourcentage||0), temps = row.totalTemps||row.totalTime||0;
    const isMe = em.toLowerCase()===myEmail;
    const count = tab==='app' ? (row.niveauxCompletes||row.niveaux||0) : (row.appsCompletes||row.apps||0);
    const total = tab==='app' ? (row.totalNiveaux||TRACKING.totalNiveaux||0) : (row.totalPossibleNiveaux||0);
    const prog = total>0 ? Math.min(100, count/total*100) : 0;
    let tStr='—'; if(temps>0){ const m=Math.floor(temps/60), s=temps%60; tStr = m>0 ? m+'m'+String(s).padStart(2,'0')+'s' : s+'s'; }
    html += `<tr style="${isMe?'background:rgba(58,224,140,.08)':''}"><td><b>${r<=3&&r>0?medals[r-1]:r}</b></td><td style="${isMe?'font-weight:800;color:var(--accent)':''}">${esc(name)}</td>
      <td class="c" style="color:var(--accent);font-weight:700">${row.totalPoints}</td><td class="c">${pct}%</td>
      <td class="c"><div style="height:6px;background:var(--bg3);border-radius:3px;overflow:hidden;min-width:60px"><i style="display:block;height:100%;width:${prog}%;background:linear-gradient(90deg,var(--accent),var(--orange))"></i></div><span class="tiny muted">${count}/${total}</span></td>
      <td class="c tiny">${tStr}</td></tr>`;
  });
  content.innerHTML = html + '</tbody></table>';
}

/* ============================================================
   DÉMARRAGE
   ============================================================ */
function init(){
  APP.rankIdx = rankIndex(APP.score);
  setScreen('welcome');
  showEmailModal();     // toujours, même si un e-mail est mémorisé
}
init();
</script>
